[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/niveta-android", "xtask"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
# internal
niveta-geom = { path = "crates/geom" }
niveta-color = { path = "crates/color" }
niveta-cms = { path = "crates/cms" }
niveta-raster = { path = "crates/raster" }
niveta-doc = { path = "crates/doc" }
niveta-ops = { path = "crates/ops" }
niveta-psd = { path = "crates/psd" }
niveta-codecs = { path = "crates/codecs" }
niveta-raw = { path = "crates/raw" }
niveta-compose = { path = "crates/compose" }
niveta-gpu = { path = "crates/gpu" }
niveta-paint = { path = "crates/paint" }
niveta-algo = { path = "crates/algo" }
niveta-io = { path = "crates/io" }
niveta-text = { path = "crates/text" }
niveta-vector = { path = "crates/vector" }
niveta-format = { path = "crates/format" }
niveta-engine = { path = "crates/engine" }
niveta-ui-egui = { path = "crates/ui-egui" }
niveta-testkit = { path = "crates/testkit" }

# external
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
arc-swap = "1"
bytemuck = { version = "1", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
image = { version = "0.25", default-features = false }
proptest = "1"
eframe = { version = "0.36", default-features = false }
egui = "0.36"
egui_kittest = "0.36"
rfd = "0.17"
log = "0.4"
rayon = "1"
criterion = { version = "0.5", default-features = false }
getrandom = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
# Igual ao CI (ci.yml): so tabelas de linha. Debug cheio: CARGO_PROFILE_DEV_DEBUG=true
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

# The browser build (apps/niveta-web, `data-cargo-profile` in its index.html). Hosts cap the
# size of a single file (Cloudflare Pages/Workers: 25 MiB), and the wasm is downloaded on every
# visit, so this profile optimizes for size: fat LTO, and opt-level "s" for everything except the
# pixel-processing crates, which keep opt-level 3 so filters and compositing stay fast. panic
# stays the target default (wasm32-unknown-unknown aborts; AGENTS.md's `panic = "unwind"` is for
# the native app shell). packaging/web/package.sh fails the build above 24 MiB. Issue #198:
# this took the wasm from 26.3 MiB (release profile) to 18.8 MiB.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.wasm-release.package."*"]
opt-level = "s"

[profile.wasm-release.package.niveta-raster]
opt-level = 3
[profile.wasm-release.package.niveta-color]
opt-level = 3
[profile.wasm-release.package.niveta-cms]
opt-level = 3
[profile.wasm-release.package.niveta-compose]
opt-level = 3
[profile.wasm-release.package.niveta-algo]
opt-level = 3
[profile.wasm-release.package.niveta-paint]
opt-level = 3
