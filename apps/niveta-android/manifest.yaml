# xbuild packaging config (read from the package root). The activity, intent
# filter and version come from the crate itself; only the application id needs
# pinning, or updates install next to a `com.example.*` placeholder.
android:
  # Launcher/splash icon: without it the APK ships no mipmap, the launcher
  # shows a placeholder and the system splash centers it on boot. Path is
  # relative to this package root; xbuild scales it into the mipmaps and sets
  # `@mipmap/icon` on the application itself.
  icon: ../../assets/app-icon/niveta-1024.png
  manifest:
    package: app.niveta
    application:
      label: Niveta
    # On-device browser (`device_browser`): photos come through the runtime
    # dialog (media on new devices, storage on old), anything else shared
    # (a PSD or .pcraft in Download is not "media") through the all-files
    # Settings screen the gate now opens itself. All-files stays sideload-only
    # (Play policy forbids it for editors).
    uses_permission:
      - name: android.permission.READ_EXTERNAL_STORAGE
        max_sdk_version: 32
      - name: android.permission.WRITE_EXTERNAL_STORAGE
        max_sdk_version: 28
      - name: android.permission.READ_MEDIA_IMAGES
      - name: android.permission.MANAGE_EXTERNAL_STORAGE
