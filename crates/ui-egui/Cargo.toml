[package]
name = "niveta-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# Screen-reader bridge (eframe/accesskit) is default-on for desktop/web; the
# Android shell disables defaults (eframe only supports accesskit with
# game-activity, and NativeActivity needs no Java at all).
[features]
default = ["accesskit"]
accesskit = ["eframe/accesskit"]

[dependencies]
niveta-geom = { workspace = true }
niveta-color = { workspace = true }
niveta-cms = { workspace = true }
niveta-raster = { workspace = true }
niveta-doc = { workspace = true }
niveta-compose = { workspace = true }
niveta-gpu = { workspace = true }
niveta-engine = { workspace = true }
niveta-io = { workspace = true }
niveta-algo = { workspace = true }
niveta-text = { workspace = true }
niveta-vector = { workspace = true }
# Only MAX_BRUSH_SIZE: `ui.set brushSize` validates against the Brush Settings range up front.
niveta-paint = { workspace = true }
# Reading files to open them (bounded reads, a clear error for files larger than memory).
niveta-format = { workspace = true }
# Decoding the brand mark's PNG (`brand.rs`); already linked through niveta-io.
niveta-codecs = { workspace = true }
egui = { workspace = true }
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { workspace = true, features = ["default_fonts", "wgpu"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
base64 = "0.22"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }
# Safe native UI-language APIs (Windows/macOS); no subprocess or web dependency.
sys-locale = "=0.3.2"

[dev-dependencies]
# Synthetic raw files for the open-time Camera Raw dialog tests.
niveta-raw = { workspace = true, features = ["testgen"] }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot", "eframe"] }
# Benchmark helpers for the `--json` benches `cargo xtask perf` runs (in-process RSS, percentiles).
niveta-testkit = { workspace = true }
# Only for examples/perf_scenarios.rs (a 500-brush .abr for the #210 import row).
niveta-psd = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
